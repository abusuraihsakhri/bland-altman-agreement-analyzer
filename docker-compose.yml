version: '3.8'

services:
  bland-altman-agreement-analyzer:
    build: .
    container_name: bland-altman-agreement-analyzer
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=bland-altman-agreement-analyzer-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
